<div class="navigation-wrapper">
	<div class="site-name">
		<a href="{{ '/' | relative_url }}">{{ site.title }}</a>
	</div><!-- /.site-name -->
	<div class="top-navigation">
		<nav role="navigation" id="site-nav" class="nav">
		    <ul>
		        {% for link in site.data.navigation.main %}
				<li><a href="{% if link.external %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}" {% if link.external %}target="_blank"{% endif %}>{{ link.title }}</a></li>
		        {% endfor %}
		    </ul>
			<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><i id="theme-icon" class="fa fa-moon-o"></i></button>
		</nav>
	</div><!-- /.top-navigation -->
</div><!-- /.navigation-wrapper -->
