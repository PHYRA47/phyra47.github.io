{% if page.image.feature %}
  <div class="image-wrap">
  <img src="{% if page.image.feature contains 'http' %}{{ page.image.feature }}{% else %}{{ page.image.feature | prepend: '/images/' | relative_url }}{% endif %}" alt="{{ page.title }} feature image">
  {% if page.image.credit %}
    <span class="image-credit">Photo Credit: <a href="{{ page.image.creditlink }}">{{ page.image.credit }}</a></span>
  {% endif %}
  </div><!-- /.image-wrap -->
{% endif %}
