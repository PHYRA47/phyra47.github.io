title:            Fromsa Teshome Negasa
description:      Fromsa Teshome Negasa's personal website.
# Your site's domain goes here. Leave localhost server or blank when working locally.
url:              https://phyra47.github.io

# Owner/author information
owner:
  name:           Fromsa Teshome Negasa
  avatar:         profile.png
  bio:            PhD Student @TAU (DSII × Microsoft)
  location:       Tampere, Finland
  employer:       Tampere University
  employer_url:   https://www.tuni.fi/en
  email:          fromsa.negasa@tuni.fi
  # Social networking links are used in author-bio sidebar. Update and remove as you like.
  linkedin: fromsa-teshome
  github: PHYRA47
# Analytics and webmaster tools stuff goes here
google_verify:
# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Top navigation is defined in _data/navigation.yml

# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone:    Europe/Helsinki
future:      true
#pygments:    true
highlighter: rouge
markdown:    kramdown
kramdown:
  extensions: ["strikethrough"]
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# https://github.com/mojombo/jekyll/wiki/Permalinks
permalink:   /:categories/:title/

syntax_highlighter_opts:
  line_numbers:
  line_numbers_start: 1
  tab_width: 4
  bold_every: 10
  css: class

include: [".htaccess", "_pages"]

# Collections (academicpages-style): one .md file per publication/project
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Default frontmatter per document type
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: page
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project
      comments: false
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]
